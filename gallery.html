<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Browse images from Shri Chhatrapati Shivaji Junior College campus and activities.">
<title>College Gallery</title>

<style>
:root {
    --primary: #0b3d91;
    --primary-soft: #edf4ff;
    --surface: #ffffff;
    --text: #1e2a37;
    --muted: #54667d;
    --border: #dfeaf7;
    --shadow: 0 12px 26px rgba(11,61,145,0.08);
}

* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(180deg, var(--primary-soft), #f6f9ff);
    color: var(--text);
}

header {
    background: linear-gradient(135deg, var(--primary), #0d2e73);
    color: white;
    text-align: center;
    padding: 2rem 1rem;
}

header h1 {
    margin: 0;
    font-size: clamp(2rem, 4vw, 3rem);
}

header p {
    margin: 0.7rem 0 0;
    opacity: 0.95;
}

.gallery {
    width: min(1200px, calc(100% - 2rem));
    margin: 2.5rem auto 1rem;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 1rem;
}

.gallery-item {
    display: block;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: var(--shadow);
    cursor: pointer;
    padding: 0;
}

.gallery-item img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    display: block;
    transition: transform 0.25s ease;
}

.gallery-item:hover img,
.gallery-item:focus-visible img {
    transform: scale(1.04);
}

.preview {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.9);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 999;
    padding: 1rem;
}

.preview.is-open { display: flex; }

.preview-inner {
    position: relative;
    max-width: min(92vw, 900px);
}

.preview img {
    max-width: 100%;
    max-height: 88vh;
    border-radius: 12px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
}

.close {
    position: absolute;
    top: -2.6rem;
    right: 0;
    color: white;
    font-size: 2.8rem;
    cursor: pointer;
    background: transparent;
    border: none;
    line-height: 1;
}

.back {
    display: inline-flex;
    margin: 1.5rem auto 3rem;
    padding: 0.9rem 1.3rem;
    background: var(--primary);
    color: white;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 700;
    justify-content: center;
    width: min(220px, calc(100% - 2rem));
    transform: translateX(-50%);
    left: 50%;
    position: relative;
}

@media (max-width:600px){
    .gallery {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.75rem;
        width: min(100% - 1rem, 800px);
    }

    .gallery-item img {
        height: 150px;
    }

    .back {
        transform: none;
        left: auto;
        width: calc(100% - 1rem);
        margin-left: 0.5rem;
        margin-right: 0.5rem;
    }
}
</style>

</head>

<body>

<div class="preview" id="preview" aria-hidden="true">
    <div class="preview-inner">
        <button type="button" class="close" aria-label="Close image preview">&times;</button>
        <img id="previewImg" alt="Selected gallery preview">
    </div>
</div>

<a href="index.html" class="back">⬅ Back to Home</a>

<script>
const preview = document.getElementById('preview');
const previewImg = document.getElementById('previewImg');
const galleryItems = document.querySelectorAll('.gallery-item');
const closeBtn = document.querySelector('.close');

function openPreview(src) {
    previewImg.src = src;
    preview.classList.add('is-open');
    preview.setAttribute('aria-hidden', 'false');
}

function closePreview() {
    preview.classList.remove('is-open');
    preview.setAttribute('aria-hidden', 'true');
}

galleryItems.forEach((item) => {
    item.addEventListener('click', function () {
        openPreview(item.dataset.src);
    });
});

closeBtn.addEventListener('click', closePreview);
preview.addEventListener('click', function (event) {
    if (event.target === preview) closePreview();
});

document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && preview.classList.contains('is-open')) {
        closePreview();
    }
});
</script>
