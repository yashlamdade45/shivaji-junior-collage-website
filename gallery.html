<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#0b3d91">
    <title>College Gallery | Shri Chhatrapati Shivaji Junior College</title>
    <style>
        :root {
            color-scheme: light;
            --primary: #0b3d91;
            --primary-dark: #072d6b;
            --surface: #fff;
            --text: #1e2a37;
            --muted: #4e5d73;
            --border: #dfe7f3;
            --shadow: 0 12px 26px rgba(11, 61, 145, 0.1);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 1rem;
            line-height: 1.65;
            color: var(--text);
            background: #f4f7fb;
        }

        :focus-visible {
            outline: 3px solid #ffbf47;
            outline-offset: 3px;
            box-shadow: 0 0 0 2px var(--primary-dark);
        }

        .skip-link {
            position: absolute;
            left: -9999px;
            top: 0;
            z-index: 10;
            padding: 0.8rem 1rem;
            color: var(--primary);
            background: white;
        }

        .skip-link:focus { left: 1rem; }

        header {
            padding: 2rem 1rem;
            color: white;
            text-align: center;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        }

        header h1 {
            margin: 0;
            font-size: clamp(2rem, 4vw, 3rem);
            line-height: 1.2;
            letter-spacing: -0.025em;
        }

        header p { margin: 0.7rem 0 0; }

        .page-nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 1rem;
        }

        .page-nav a {
            display: inline-flex;
            align-items: center;
            min-height: 44px;
            color: white;
            font-weight: 700;
            text-decoration: underline;
            text-underline-offset: 0.2em;
        }

        main {
            width: min(1200px, calc(100% - 2rem));
            margin: 2rem auto;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr));
            gap: 1rem;
        }

        .gallery-item {
            padding: 0;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: var(--surface);
            box-shadow: var(--shadow);
            cursor: zoom-in;
        }

        .gallery-item img {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            transition: transform 0.25s ease;
        }

        .gallery-item:hover img,
        .gallery-item:focus-visible img { transform: scale(1.04); }

        .preview {
            width: min(100% - 2rem, 1000px);
            max-width: none;
            max-height: min(92vh, 900px);
            padding: 1rem;
            overflow: auto;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            color: white;
            background: #101725;
        }

        .preview::backdrop { background: rgba(0, 0, 0, 0.88); }

        .preview-inner {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            grid-template-rows: auto minmax(0, 1fr) auto;
            align-items: center;
            gap: 0.75rem;
        }

        .preview-heading {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .preview-heading h2 {
            margin: 0;
            font-size: 1.2rem;
        }

        .preview button {
            min-width: 44px;
            min-height: 44px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 10px;
            color: white;
            background: #263248;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .preview .close { font-size: 1.6rem; }

        .preview img {
            display: block;
            grid-column: 2;
            width: 100%;
            max-height: 72vh;
            object-fit: contain;
            border-radius: 8px;
        }

        .preview-caption {
            grid-column: 1 / -1;
            margin: 0;
            color: #e6edf7;
            text-align: center;
        }

        .back {
            display: flex;
            align-items: center;
            justify-content: center;
            width: fit-content;
            min-height: 48px;
            margin: 2rem auto;
            padding: 0.7rem 1.2rem;
            border-radius: 10px;
            color: white;
            background: var(--primary);
            font-weight: 700;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            main { width: calc(100% - 1rem); }
            .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.6rem; }
            .preview { padding: 0.65rem; }
            .preview-inner { gap: 0.4rem; }
            .preview img { max-height: 68vh; }
            .preview button { min-width: 40px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
